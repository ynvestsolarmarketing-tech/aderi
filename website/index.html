  <body>

    <!-- Cookie Banner -->
    <div id="cookie-banner" style="position: fixed; bottom: 0; left: 0; width: 100%; background: #0e171f; color: #fff; padding: 1rem; text-align: center; z-index: 9999; display: none;">

    </div>
    <script>
      if (!localStorage.getItem('cookieAccepted')) {

      }
