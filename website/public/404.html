<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Página não encontrada | ADERI</title>
    <meta name="description" content="A página que você tentou acessar na ADERI não foi encontrada. Volte para a tela inicial e simule sua economia com energia solar." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #ffffff; 
        color: #0f172a;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        text-align: center;
        padding: 2rem;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(2, 132, 199, 0.15) 0%, transparent 70%);
        filter: blur(80px);
        z-index: -1;
      }
      h1 { 
        font-family: 'Outfit', sans-serif;
        font-size: clamp(6rem, 20vw, 12rem); 
        font-weight: 800;
        line-height: 1;
        letter-spacing: -4px;
        background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
      }
      h2 {
        font-family: 'Outfit', sans-serif;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 600;
        letter-spacing: -1px;
        margin-bottom: 1rem;
      }
      p { 
        font-size: 1.125rem; 
        color: #64748b;
        max-width: 500px;
        margin-bottom: 2.5rem; 
        line-height: 1.6;
      }
      a.btn { 
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 1rem 2rem; 
        background: #0284c7; 
        color: #ffffff; 
        text-decoration: none; 
        border-radius: 99px; 
        font-weight: 600; 
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
      }
      a.btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
      }
      .logo {
        position: absolute;
        top: 2rem;
        left: 2rem;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <img src="/favicon.png" alt="Logotipo da ADERI Energia Solar por Assinatura" class="logo" />
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>Desculpe, a página que você está tentando acessar não existe, foi movida ou está temporariamente indisponível.</p>
    <a href="/" class="btn">Voltar para o Início</a>
  </body>
</html>
